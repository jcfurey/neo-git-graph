name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true

      - name: Format check
        run: pnpm run format

      - name: Run lint
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Check l10n
        run: pnpm run l10n:check

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Run tests
        run: pnpm run test

      - name: Run extension and UI tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:ext

      - name: Run extension and UI tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: pnpm run test:ext

      - name: Collect UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

      - name: Build installable extension
        if: runner.os == 'Linux'
        run: pnpm exec vsce package --no-dependencies --out neo-git-graph.vsix

      - name: Upload extension
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: neo-git-graph-vsix
          path: neo-git-graph.vsix
